  <!-- HERO
       Behind the copy runs the rain from mimicrydesign.co.jp's home page:
       diagonal rain across a pale ground, and one object at a time drifting in
       and out at the centre. js/rain-hero.js runs the objects.

       The objects follow theirs in order: an umbrella that opens, takes the
       rain and closes, a paper plane, and a message in a bottle. They are
       flat SVGs in images/hero/, generated rather than traced. Each object is
       one .rain-object. For a still, put an <img> inside it. For a flipbook,
       list frame paths, separated by spaces, in data-frames-in (played once
       on arrival), data-frames (looped while it holds) and data-frames-out
       (played once before it leaves), at 6 frames a second. Add data-bob for
       the slow up-and-down drift. -->
  <section class="hero rain-hero">
    <!-- The rain is hidden for now. Delete the hidden attribute to bring it back. -->
    <div class="rain-hero__sky" aria-hidden="true" hidden><div class="rain-hero__rain"></div></div>
    <!-- The objects are hidden for now: Edward is finding better references.
         Delete the hidden attribute below to bring them back. -->
    <div class="rain-hero__stage" aria-hidden="true" hidden>
      <div class="rain-object"
           data-frames-in="images/hero/umbrella-1.svg images/hero/umbrella-2.svg images/hero/umbrella-3.svg images/hero/umbrella-4.svg images/hero/umbrella-5.svg"
           data-frames="images/hero/umbrella-drops-1.svg images/hero/umbrella-drops-2.svg"
           data-frames-out="images/hero/umbrella-5.svg images/hero/umbrella-4.svg images/hero/umbrella-3.svg images/hero/umbrella-2.svg images/hero/umbrella-1.svg"></div>
      <div class="rain-object"
           data-frames="images/hero/plane-1.svg images/hero/plane-2.svg images/hero/plane-3.svg images/hero/plane-4.svg images/hero/plane-5.svg images/hero/plane-6.svg images/hero/plane-7.svg images/hero/plane-8.svg"></div>
      <div class="rain-object" data-bob><img src="images/hero/bottle.svg" alt="" /></div>
    </div>
    <div class="hero-copy">
      <p class="hero-headline">Edward Chen is a systems designer driven by the belief that craft is care.</p>
      <p class="hero-sub">Studying Design &amp; HCI @ Carnegie Mellon University</p>
      <a href="mailto:edwardchen530@gmail.com" class="pill-button">Get in touch</a>
    </div>
  </section>
