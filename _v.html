<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden}iframe{width:1440px;height:900px;border:0;display:block}</style></head>
<body><iframe id="f"></iframe><script>
var q=new URLSearchParams(location.search);
var f=document.getElementById('f');
f.onload=function(){
  var w=this.contentWindow,d=this.contentDocument;
  var s=d.createElement('style');s.textContent='html{scroll-behavior:auto!important}.nav a{transition:none!important}';d.head.appendChild(s);
  var y=parseInt(q.get('y')||'0',10);
  function go(){w.scrollTo(0,y);d.documentElement.scrollTop=y;w.dispatchEvent(new Event('scroll'));}
  go();setTimeout(go,400);setTimeout(go,1100);
};
f.src=q.get('u')||'/index.html';
</script></body></html>
