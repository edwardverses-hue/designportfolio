<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sessions Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&display=swap" rel="stylesheet">
<style>
/* Sessions, built from the final Figma screens (Personal Work, Study App).
   Every colour, size and blur below is the file's own: the backgrounds are
   its blurred ellipses, the glass is its 10% white with a 25% white edge. */
:root{
  --bg:#FBFEFF; --ink:#231F20; --ink50:rgba(35,31,32,.5); --slate:#6C848E; --deep:#34434A;
  --pale:#D9F4FF; --peach:#FEDBC7; --line:#E5E5E5; --dark:#596E77;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.4,.64,1);
  /* Helvetica Neue where the system has it, as in the file; Inter Light, the
     closest open face, everywhere else. */
  --sans:"Helvetica Neue","HelveticaNeue",Inter,Helvetica,Arial,sans-serif;
  --sys:-apple-system,"SF Pro Text",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#E9EEF1;font-family:var(--sans);font-weight:300;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
input{font:inherit;color:inherit}
.med{font-weight:500}
svg.i{display:block;flex:none}

/* stage and device */
#stage{position:fixed;inset:0;display:grid;place-items:center}
#scaler{transform-origin:center center}
#device{position:relative;width:402px;height:874px;border-radius:60px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 10px #101114,0 0 0 11px #2A2C31,0 30px 60px rgba(16,24,40,.25)}
@media (max-width:440px){ body{background:var(--bg)} #device{border-radius:0;box-shadow:none} }
#restart{position:fixed;top:16px;right:16px;font-size:13px;color:var(--slate);padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.7)}
@media (max-width:440px){ #restart{display:none} }

/* status bar */
#status{position:absolute;inset:0 0 auto 0;height:54px;z-index:60;pointer-events:none;font-family:var(--sys);color:var(--ink)}
#status .time{position:absolute;left:32px;top:17px;width:64px;text-align:center;font-weight:600;font-size:16px;letter-spacing:-.2px}
#status .island{position:absolute;left:138px;top:11px;width:126px;height:36px;border-radius:18px;background:#000}
#status .right{position:absolute;right:30px;top:21px;display:flex;gap:6px;align-items:center}

/* screens */
#viewport{position:absolute;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;background:var(--bg);overflow:hidden;will-change:transform,opacity}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.t-in-right{animation:inRight .5s var(--ease) both}.t-out-left{animation:outLeft .5s var(--ease) both}
.t-in-left{animation:inLeft .5s var(--ease) both}.t-out-right{animation:outRight .5s var(--ease) both}
.t-in-fade{animation:fadeIn .45s ease-out both}.t-out-fade{animation:fadeOut .45s ease-out both}
@keyframes inRight{from{transform:translateX(100%)}to{transform:none}}
@keyframes outLeft{from{transform:none}to{transform:translateX(-30%);opacity:.6}}
@keyframes inLeft{from{transform:translateX(-30%);opacity:.6}to{transform:none;opacity:1}}
@keyframes outRight{from{transform:none}to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}

/* the file's light: blurred ellipses behind everything */
.glow{position:absolute;border-radius:50%;pointer-events:none}
.glow.sq{border-radius:0}

/* type */
.h1{font-weight:500;font-size:32px;line-height:1.15;color:var(--ink);margin:0}
.t24{font-size:24px}.t20{font-size:20px}.t16{font-size:16px}.t12{font-size:12px}
.mut{color:var(--ink50)}
.grad-text{background:linear-gradient(180deg,#FBFEFF 22%,#D9F4FF 82%);-webkit-background-clip:text;background-clip:text;color:transparent}
.warm-text{background:linear-gradient(90deg,#FEDBC7 26%,#D9F4FF 74%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* glass */
.glass{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:250px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.glass-pale{background:rgba(217,244,255,.25);border:1px solid rgba(255,255,255,.25)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:44px;font-size:20px;color:var(--ink);border-radius:15px;transition:transform .15s ease}
.btn:active{transform:scale(.98)}
/* The file's primary: pale blue with a white glow inside its edge. The file
   set some labels in white on it, which is about 1.2:1; here every label is
   ink, about 14:1. */
.btn.primary{background:var(--pale);border:1px solid rgba(217,244,255,.5);box-shadow:inset 0 0 15px 6.7px var(--bg)}
.btn.secondary{background:rgba(251,254,255,.5);border:1px solid rgba(255,255,255,.25);border-radius:12.5px}
.btn.outline{border:1px solid var(--line);background:var(--bg)}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn.pale{background:rgba(217,244,255,.5);border:1px solid rgba(255,255,255,.25)}
.iconbtn.clear{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25)}
.small{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 20px;border-radius:10px;font-size:16px}
.small.blue{background:var(--pale)}
.small.line{border:1px solid var(--line);background:var(--bg)}

/* rows and cards */
.row{display:flex;align-items:center;gap:20px;min-height:60px;padding:5px;border:1px solid var(--line);border-radius:15px;background:var(--bg);width:100%;text-align:left}
.avatar{width:50px;height:50px;border-radius:12.5px;background:var(--line);display:grid;place-items:center;flex:none}
.avatar.round{border-radius:50%;background:rgba(217,244,255,.5);border:1px solid rgba(255,255,255,.25)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .txt .a{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .txt .b{font-size:16px;color:var(--ink50)}
.row .go{width:50px;height:50px;display:grid;place-items:center;flex:none}
.card{border:1px solid var(--line);border-radius:15px;background:var(--bg)}
.bar{height:5px;border-radius:250px;background:rgba(229,229,229,.5);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:250px;background:linear-gradient(90deg,#FEDBC7,#D9F4FF)}

/* tab bar: near-black, the active tab under a glass lens */
#tabbar{position:absolute;left:20px;bottom:50px;width:362px;height:47px;border-radius:36.654px;background:#231F20;z-index:40;display:none}
#tabbar.on{display:block}
#tabbar .lens{position:absolute;top:0;left:0;width:88.3px;height:46.9px;border-radius:36.654px;background:rgba(217,244,255,.2);border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 2.8px 2.8px rgba(0,0,0,.25),0 2.8px 2.8px rgba(0,0,0,.25);transition:left .45s var(--spring)}
#tabbar .tabs{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 54px 0 53px}
#tabbar button{width:44px;height:44px;display:grid;place-items:center;color:rgba(217,244,255,.75);position:relative;z-index:1}
#tabbar button[aria-current="page"]{color:#D9F4FF}

/* sheets */
#ov{position:absolute;inset:0;z-index:70;pointer-events:none}
#ov.on{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(35,31,32,.18);opacity:0;transition:opacity .35s ease}
#ov.on .scrim{opacity:1}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:40px;background:rgba(251,254,255,.92);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.6);padding:14px 20px 24px;transform:translateY(110%);transition:transform .5s var(--ease);box-shadow:0 -10px 40px rgba(52,67,74,.12)}
#ov.on .sheet{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(35,31,32,.15);margin:0 auto 18px}

/* toast and notification */
#toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,20px);opacity:0;z-index:80;padding:12px 20px;border-radius:250px;background:rgba(35,31,32,.86);color:#FBFEFF;font-size:16px;white-space:nowrap;transition:opacity .3s ease,transform .4s var(--ease);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#note{position:absolute;left:10px;right:10px;top:56px;z-index:75;border-radius:26px;padding:14px 16px;display:flex;gap:12px;align-items:center;background:rgba(251,254,255,.82);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(52,67,74,.16);transform:translateY(-180px);transition:transform .55s var(--ease);text-align:left;width:auto}
#note.show{transform:none}
#note .app{width:38px;height:38px;border-radius:10px;flex:none;background:radial-gradient(60% 70% at 50% 55%,#34434A 0%,#6C848E 45%,#D9F4FF 100%)}

/* map */
.map{position:absolute;left:-249px;top:0;width:900px;height:876px;background:url("sessions-proto/map.png") 0 0/900px 876px no-repeat}
.toppill{position:absolute;top:100px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px;height:44px;padding:0 24px;border-radius:250px;background:rgba(251,254,255,.7);border:1px solid rgba(255,255,255,.6);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:20px;white-space:nowrap;z-index:5}
.pin{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:4}
.pin .dot{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:rgba(217,244,255,.7);border:1px solid rgba(255,255,255,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pin .lab{padding:8px 18px;border-radius:12px;background:rgba(217,244,255,.7);border:1px solid rgba(255,255,255,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);text-align:center;white-space:nowrap}
.pin .lab span{display:block}
.pin .lab .n{font-size:24px;line-height:1.1}
.pin .lab .e{font-size:12px;color:var(--slate)}
.pin.group .dot{background:linear-gradient(135deg,rgba(254,219,199,.8),rgba(217,244,255,.8))}
.pin.group .lab{background:linear-gradient(110deg,rgba(254,219,199,.75),rgba(217,244,255,.75))}
.pin.on .lab{box-shadow:0 0 0 1.5px var(--slate)}
.mapcard{position:absolute;left:28px;right:28px;bottom:150px;z-index:5;display:flex;gap:12px;align-items:center;padding:14px 12px 14px 16px;border-radius:15px;background:rgba(251,254,255,.8);border:1px solid rgba(255,255,255,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.startbtn{position:absolute;right:20px;top:100px;z-index:6}

/* timer screens */
.timer-dark .glow{will-change:auto}
.tag{position:absolute;top:100px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--slate);font-size:24px;white-space:nowrap}
.readout{position:absolute;left:0;right:0;top:354px;text-align:center}
.readout .num{font-size:96px;line-height:113px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.readout .lab{font-size:20px;color:#D9F4FF;margin-top:10px}
.pager{display:flex;gap:10px;justify-content:center;margin-top:10px}
.pager button{width:9px;height:9px;border-radius:50%;border:1px solid rgba(217,244,255,.8)}
.pager button[aria-pressed="true"]{background:#D9F4FF}
.seg{position:absolute;top:100px;left:84px;width:234px;height:60px;border-radius:250px;display:flex;align-items:center;padding:2px}
.seg .knob{position:absolute;top:2px;left:2px;width:111px;height:54px;border-radius:250px;background:var(--pale);border:1px solid rgba(255,255,255,.25);transition:left .4s var(--spring),width .4s var(--spring)}
.seg button{position:relative;z-index:1;flex:1;height:54px;font-size:24px;color:var(--ink50);transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.hours{position:absolute;left:0;right:0;top:362px;text-align:center}
.hours .big{font-weight:500;font-size:128px;line-height:1}
.hours .unit{font-size:24px;color:#D9F4FF;margin-top:4px}
.dial{position:absolute;left:-7px;top:565px;width:417px;height:417px;touch-action:none;cursor:grab}
.go{position:absolute;right:20px;top:764px;width:217px;height:60px;border-radius:250px;display:flex;align-items:center;padding:5px;overflow:hidden;touch-action:none}
.go .knob{position:relative;z-index:2;width:50px;height:50px;border-radius:50%;background:var(--pale);display:grid;place-items:center;color:var(--dark);transition:transform .35s var(--ease)}
.go .lab{position:absolute;left:85px;font-size:24px;color:#D9F4FF}
.go .chev{position:absolute;right:20px;display:flex}
.go .chev svg{margin-left:-5px}
.bottomrow{position:absolute;left:20px;right:20px;bottom:50px;display:flex;justify-content:space-between;align-items:center}
.pillbtn{display:flex;align-items:center;gap:20px;padding:10px 20px;font-size:24px;color:#D9F4FF;height:52px}
.along{position:absolute;left:50%;bottom:152px;transform:translateX(-50%);display:flex;align-items:center;gap:20px;padding:10px 20px;color:var(--slate);font-size:24px;white-space:nowrap}

/* onboarding */
.steps{display:flex;gap:4.5px}
.steps i{width:43.2px;height:5.6px;border-radius:4.5px;border:.5px solid var(--ink)}
.steps i.on{background:var(--pale)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{white-space:nowrap;height:39px;padding:0 10px;border-radius:12.5px;border:1px solid var(--line);font-size:16px;background:var(--bg);transition:background .2s,border-color .2s}
.chip[aria-pressed="true"]{background:rgba(217,244,255,.6);border-color:rgba(108,132,142,.55)}
.chip.add{width:39px;padding:0;display:grid;place-items:center}
.opt{display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:var(--bg);width:100%;text-align:left;transition:background .2s,border-color .2s}
.opt[aria-checked="true"]{background:rgba(217,244,255,.45);border-color:rgba(108,132,142,.5)}
.opt .rad{width:22px;height:22px;border-radius:50%;border:1px solid var(--slate);display:grid;place-items:center;flex:none}
.opt[aria-checked="true"] .rad::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--slate)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.15);transition:transform .3s var(--spring)}
.switch[aria-checked="true"]{background:var(--slate)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* field */
.field{display:flex;align-items:center;justify-content:space-between;height:62px;padding:5px 5px 5px 25px;border-radius:61.8px;background:rgba(217,244,255,.25);border:1px solid rgba(255,255,255,.25);width:100%}
.field input{flex:1;background:none;border:0;outline:none;font-size:20px;color:#FBFEFF;min-width:0}
.field input::placeholder{color:rgba(255,255,255,.5)}
.field .send{width:52px;height:52px;border-radius:50%;background:var(--pale);display:grid;place-items:center;color:var(--bg);flex:none}
.search{display:flex;align-items:center;gap:20px;height:44px;padding:0 25px;border-radius:250px;background:rgba(217,244,255,.25);border:1px solid rgba(255,255,255,.25);font-size:20px}
.search .ph{flex:1;color:var(--ink50)}

/* screen frame helpers */
.pad{position:absolute;left:20px;right:20px}
.stack{display:flex;flex-direction:column}
.center{text-align:center}
.fade-bottom{position:absolute;left:-17px;right:-17px;bottom:-60px;height:180px;background:var(--bg);filter:blur(25px);pointer-events:none;z-index:3}
</style>
</head>

  <div id="viewport"></div>
  <nav id="tabbar" aria-label="Main">
    <div class="lens"></div>
    <div class="tabs">
      <button data-tab="map" aria-label="Map"></button>

const START={name:'Emma',subject:'Calculus',pub:true,mins:60,elapsed:35*60+6,running:false,paused:false,joined:false,
  along:3,streak:16,total:30,quiet:false,share:'friends',building:true,prefs:{Design:true,'Computer science':true,Math:false,Weekdays:false,Evenings:false,Silent:true,Discussion:false,Groupwork:false,Physical:false,Remote:false,Both:true},
  added:{},accepted:false,filter:'all',page:0,step:'pref'};

/* ---------- navigation ---------- */
const stack=[];let cur=null,curId=null;
const TABS=['map','friends','profile'];
function setTab(id){
  const on=TABS.includes(id);TB.classList.toggle('on',on);
  if(!on)return;
  const i=TABS.indexOf(id);
  TB.querySelector('.lens').style.left=[31,137,242][i]+'px';
  TB.querySelectorAll('button').forEach((b,k)=>{b.innerHTML=I(['pin','users','user'][k],32);b.toggleAttribute('aria-current',k===i);if(k===i)b.setAttribute('aria-current','page');});
}
function go(id,o={}){
  const t=o.t||'push';
  const s=el(`<section class="screen" data-screen="${id}" aria-label="${(SCR[id].label||id)}"></section>`);
  s.innerHTML=SCR[id].html(o);
  VP.appendChild(s);
  if(SCR[id].mount)SCR[id].mount(s,o);
  const prev=cur;
  if(prev&&t!=='none'&&!reduce){
    const [a,b]=t==='push'?['t-in-right','t-out-left']:t==='back'?['t-in-left','t-out-right']:['t-in-fade','t-out-fade'];
    if(t==='back'){s.style.zIndex=0;prev.style.zIndex=1;}
    s.classList.add(a);prev.classList.add(b);
    setTimeout(()=>{prev.remove();s.classList.remove(a);s.style.zIndex='';},520);
  }else if(prev)prev.remove();
  if(prev&&SCR[curId]&&SCR[curId].leave)SCR[curId].leave();
  if(t==='push')stack.push(curId);else if(t!=='back')stack.length=0;
  cur=s;curId=id;setTab(id);live(SCR[id].label||'');
}
function back(){const p=stack.pop();if(p)go(p,{t:'back'});}
TB.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b||b.dataset.tab===curId)return;go(b.dataset.tab,{t:'fade'});});

/* sheets */
let sheetClose=null;
function openSheet(html,mount){
  closeSheet(true);
  const sh=el(`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`);
  OV.appendChild(sh);
  requestAnimationFrame(()=>requestAnimationFrame(()=>OV.classList.add('on')));
  if(mount)mount(sh);
  sheetClose=()=>{OV.classList.remove('on');setTimeout(()=>sh.remove(),reduce?0:450);};
}
function closeSheet(now){const s=OV.querySelector('.sheet');if(!s)return;if(now){OV.classList.remove('on');s.remove();return;}sheetClose&&sheetClose();}
OV.querySelector('.scrim').addEventListener('click',()=>closeSheet());

/* notification */
function notify(html,onTap){const n=$('#note');n.innerHTML=`<span class="app" aria-hidden="true"></span><span style="flex:1;min-width:0">${html}</span>`;n.onclick=()=>{n.classList.remove('show');onTap&&onTap();};n.classList.add('show');}
function unnotify(){$('#note').classList.remove('show');}

function fmt(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function minsLabel(m){if(m<60)return{big:String(m),unit:'minutes'};const h=m/60;return{big:(Number.isInteger(h)?h:h.toFixed(2).replace(/0$/,'')),unit:h===1?'hour':'hours'};}

dial:{label:'Set the length',html:()=>{
  const L=minsLabel(S.mins);
  let ticks='';for(let k=-24;k<=24;k++){const a=k*3.1*Math.PI/180,r1=k===0?160:178,r2=208,cx=208.5,cy=208.5;const x1=cx+r1*Math.sin(a),y1=cy-r1*Math.cos(a),x2=cx+r2*Math.sin(a),y2=cy-r2*Math.cos(a);
    const o=k===0?1:Math.max(.12,1-Math.abs(k)/24);ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${k===0?'#596E77':'#FBFEFF'}" stroke-opacity="${o.toFixed(2)}" stroke-width="${k===0?4:k%4===0?4.5:2.5}" stroke-linecap="round"/>`;}
  return `${LIGHT.timer}
  <div class="seg glass" role="group" aria-label="Who can see this session"><span class="knob" style="${S.pub?'':'left:117px;width:115px'}"></span><button data-pub="1" aria-pressed="${S.pub}">Public</button><button data-pub="0" aria-pressed="${!S.pub}">Private</button></div>
  <div class="hours" aria-live="polite"><div class="big grad-text" data-big>${L.big}</div><div class="unit" data-unit>${L.unit}</div></div>
  <svg class="dial" data-dial viewBox="0 0 417 417" role="slider" tabindex="0" aria-label="Session length" aria-valuemin="15" aria-valuemax="240" aria-valuenow="${S.mins}" aria-valuetext="${L.big} ${L.unit}"><g data-ticks>${ticks}</g></svg>
  <div class="bottomrow" style="bottom:50px"><button class="iconbtn clear" data-back aria-label="Close" style="color:var(--dark)">${I('close')}</button></div>
  <div class="go glass" data-go-slider role="button" tabindex="0" aria-label="Slide to start"><span class="knob" data-knob>${I('right')}</span><span class="lab">Go</span><span class="chev" style="color:#D9F4FF"><span style="opacity:.25">${I('chevron')}</span><span style="opacity:.5">${I('chevron')}</span><span>${I('chevron')}</span></span></div>`},
  mount(s){
    s.querySelectorAll('[data-pub]').forEach(b=>b.onclick=()=>{S.pub=b.dataset.pub==='1';const k=s.querySelector('.seg .knob');k.style.left=S.pub?'2px':'117px';k.style.width=S.pub?'111px':'115px';s.querySelectorAll('[data-pub]').forEach(x=>x.setAttribute('aria-pressed',(x.dataset.pub==='1')===S.pub));});
    const dial=s.querySelector('[data-dial]'),ticks=s.querySelector('[data-ticks]');
    const set=m=>{S.mins=Math.max(15,Math.min(240,m));const L=minsLabel(S.mins);s.querySelector('[data-big]').textContent=L.big;s.querySelector('[data-unit]').textContent=L.unit;dial.setAttribute('aria-valuenow',S.mins);dial.setAttribute('aria-valuetext',L.big+' '+L.unit);};
    let x0=null,m0=0;
    dial.addEventListener('pointerdown',e=>{x0=e.clientX;m0=S.mins;dial.setPointerCapture(e.pointerId);});
    dial.addEventListener('pointermove',e=>{if(x0===null)return;const k=$('#device').getBoundingClientRect().width/402,dx=(e.clientX-x0)/k;ticks.style.transform=`rotate(${(dx/6)%3.1}deg)`;ticks.style.transformOrigin='208.5px 208.5px';set(m0-Math.round(dx/18)*15);});
    dial.addEventListener('pointerup',()=>{x0=null;ticks.style.transition='transform .3s var(--ease)';ticks.style.transform='';setTimeout(()=>ticks.style.transition='',320);});
    dial.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp')set(S.mins+15);if(e.key==='ArrowLeft'||e.key==='ArrowDown')set(S.mins-15);});
    s.nudge=d=>{ticks.style.transition='transform .45s var(--ease)';ticks.style.transform=`rotate(${-d*3.1}deg)`;ticks.style.transformOrigin='208.5px 208.5px';set(S.mins+d*15);setTimeout(()=>{ticks.style.transform='';},460);};
    const sl=s.querySelector('[data-go-slider]'),kn=s.querySelector('[data-knob]');const MAX=157;let sx=null;
    const start=()=>{kn.style.transform=`translateX(${MAX}px)`;setTimeout(()=>{S.elapsed=0;S.running=true;S.joined=false;S.along=3;go('run',{t:'fade'});},reduce?0:380);};
    sl.addEventListener('pointerdown',e=>{sx=e.clientX;kn.style.transition='none';sl.setPointerCapture(e.pointerId);});
    sl.addEventListener('pointermove',e=>{if(sx===null)return;const k=$('#device').getBoundingClientRect().width/402;kn.style.transform=`translateX(${Math.max(0,Math.min(MAX,(e.clientX-sx)/k))}px)`;});
    sl.addEventListener('pointerup',e=>{if(sx===null)return;const k=$('#device').getBoundingClientRect().width/402,d=(e.clientX-sx)/k;sx=null;kn.style.transition='';if(d>MAX*.7)start();else kn.style.transform='';});
    sl.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();start();}});
    s.slide=start;}},

<style>
/* Embedded in the case study, the page draws the phone around this, so the
   device loses its own frame and fills the iframe edge to edge. */
html.embed,html.embed body{background:transparent}

.tapdot{position:absolute;z-index:90;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(35,31,32,.16);box-shadow:0 0 0 1.5px rgba(255,255,255,.85);opacity:0;pointer-events:none}
.tapdot.on{animation:tapdot .62s var(--ease) both}
.tapdot.drag{opacity:1;animation:none;transition:left .7s var(--ease)}
@keyframes tapdot{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1)}45%{opacity:1;transform:scale(.86)}100%{opacity:0;transform:scale(1.04)}}
.taplock{position:absolute;inset:0;z-index:95}
html.paused *,html.paused *::before,html.paused *::after{animation-play-state:paused!important}
html.still *,html.still *::before,html.still *::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0s!important}
html.still .tapdot{display:none}
</style>
<script>
/* ===================== embedded scenes =====================
   The case study shows this prototype one moment at a time, each in its own
   iframe: sessions-prototype.html?embed&scene=<name>[&mode=still]
   Same protocol as the CVS prototype, so the page's js/cvs-demos.js drives
   both: {cvs:'play'|'pause'|'restart'} in, {cvs:'state'} and {cvs:'event'} out.
   A scene runs by tapping the real controls, holds its last frame, fades and
   repeats. mode=still lands on the last frame with motion off. */
if(EMBED)(()=>{
  const q=new URLSearchParams(location.search),name=q.get('scene');let mode=q.get('mode')||'start';
  if(reduce)mode='still';
  if(mode==='still'){reduce=true;document.documentElement.classList.add('still');}
  const send=o=>{try{parent.postMessage(Object.assign({cvs:'state',scene:name},o),'*');}catch(e){}};
  addEventListener('error',e=>{document.documentElement.dataset.err=e.message;});
  $('#live').removeAttribute('aria-live');$('#toast').removeAttribute('aria-live');$('#toast').removeAttribute('role');$('#note').removeAttribute('aria-live');
  const dev=$('#device');
  const dot=el('<div class="tapdot" aria-hidden="true"></div>');dev.appendChild(dot);
  dev.appendChild(el('<div class="taplock" aria-hidden="true"></div>'));
  let paused=true,started=false,gen=0;const ABORT={};
  const sleep=ms=>{const g=gen;let left=mode==='still'?0:ms;return new Promise((res,rej)=>{(function t(){if(g!==gen)return rej(ABORT);if(left<=0)return res();
    setTimeout(()=>{if(!paused)left-=40;t();},40);})();});};
  const find=sel=>{for(const r of [OV.querySelector('.sheet'),$('#note'),cur,TB]){if(!r)continue;if(r.matches&&r.matches(sel))return r;const e=r.querySelector(sel);if(e)return e;}return null;};
  async function get(sel){const g=gen;let waited=0;for(;;){if(g!==gen)throw ABORT;const e=find(sel);if(e&&!e.disabled)return e;
    await new Promise(r=>setTimeout(r,50));if(!paused)waited+=50;if(waited>9000)throw new Error('scene '+name+': nothing matched '+sel);}}
  const at=e=>{const d=dev.getBoundingClientRect(),r=e.getBoundingClientRect(),k=d.width/402;return{x:(r.left-d.left)/k,y:(r.top-d.top)/k,w:r.width/k,h:r.height/k};};
  async function point(e){if(mode==='still')return;const p=at(e);dot.style.left=p.x+p.w/2+'px';dot.style.top=p.y+p.h/2+'px';dot.classList.remove('on');void dot.offsetWidth;dot.classList.add('on');await sleep(270);}
  async function tap(sel){const e=await get(sel);await point(e);e.click();}
  async function type(sel,text){const i=await get(sel);for(const ch of text){i.value+=ch;if(mode!=='still')await sleep(110);}}
  async function scrollTo(y){const s=await get('[data-scroll]');s.scrollTo({top:y,behavior:mode==='still'?'auto':'smooth'});await sleep(900);}
  /* the Go slider dragged by the dot, not tapped: it only starts on a slide */
  async function slide(){const sl=await get('[data-go-slider]'),kn=sl.querySelector('[data-knob]');
    if(mode!=='still'){const p=at(kn);dot.style.left=p.x+25+'px';dot.style.top=p.y+25+'px';dot.classList.add('drag');await sleep(200);
      dot.style.left=p.x+25+157+'px';kn.style.transition='transform .7s var(--ease)';kn.style.transform='translateX(157px)';await sleep(760);dot.classList.remove('drag');}
    cur.slide();}
  const SC={
    onboard:{start(){go('welcome',{t:'none'});},async run(){await sleep(900);await tap('[data-go="pref"]');await sleep(1300);await tap('[data-chip="Evenings"]');await sleep(500);await tap('[data-chip="Discussion"]');await sleep(900);await tap('[data-go="where"]');await sleep(1400);await tap('[data-share="close"]');await sleep(900);await tap('[data-building]');await sleep(700);await tap('[data-building]');await sleep(800);}},
    start:{start(){go('ask',{t:'none'});},async run(){await sleep(900);await type('[data-name]','Calculus');await sleep(500);await tap('.send');await sleep(1300);await tap('[data-pub="0"]');await sleep(700);await tap('[data-pub="1"]');await sleep(600);cur.nudge(2);await sleep(1100);await slide();await sleep(2600);}},
    join:{start(){go('map',{t:'none'});},async run(){await sleep(1000);notify('<span class="t16" style="display:block">Library Session is filling up</span><span class="t12 mut">Sean and Eileen are in · ends in 1h 30m</span>',()=>{cur.querySelector('[data-pin="library"]').classList.add('on');joinSheet();});await sleep(1800);await tap('#note');await sleep(1600);await tap('[data-dojoin]');await sleep(3200);}},
    run:{start(){S.elapsed=35*60+6;go('run',{t:'none'});},async run(){await sleep(1800);await tap('[data-page="1"]');await sleep(1600);await tap('[data-page="3"]');await sleep(1600);await tap('[data-page="0"]');await sleep(1000);await tap('[data-pause]');await sleep(1400);await tap('[data-pause]');await sleep(800);}},
    finish:{start(){S.elapsed=52*60+12;go('run',{t:'none'});},async run(){await sleep(1100);await tap('[data-end]');await sleep(1700);await tap('[data-stop]');await sleep(3000);}},
    map:{start(){go('map',{t:'none'});},async run(){await sleep(1200);await tap('[data-pin="library"]');await sleep(1800);await tap('[data-notnow]');await sleep(900);}},
    quiet:{start(){S.quiet=true;go('map',{t:'none'});},async run(){await sleep(2200);}},
    friends:{start(){go('friends',{t:'none'});},async run(){await sleep(1000);await tap('[data-filter="now"]');await sleep(1300);await tap('[data-filter="req"]');await sleep(1200);await tap('[data-accept]');await sleep(1600);await tap('[data-go="add"]');await sleep(1300);await tap('[data-addp="Brendon Lin"]');await sleep(1200);await tap('[data-invite]');await sleep(1600);}},
    challenge:{start(){go('challenge',{t:'none'});},async run(){await sleep(1400);await scrollTo(420);await sleep(1200);await scrollTo(760);await sleep(1400);}},
    history:{start(){go('history',{t:'none'});},async run(){await sleep(1400);await scrollTo(380);await sleep(1600);}},
    done:{start(){S.elapsed=2*3600;go('done',{t:'none'});},async run(){await sleep(2200);}},
    streak:{start(){go('streak',{t:'none'});},async run(){await sleep(1800);await tap('[data-go="ask"]');await sleep(1600);}},
    milestone:{start(){go('milestone',{t:'none'});},async run(){await sleep(2400);}},
    privacy:{start(){go('profile',{t:'none'});},async run(){await sleep(1000);await tap('[data-settings]');await sleep(1400);await tap('[data-share="me"]');await sleep(1200);await tap('[data-share="friends"]');await sleep(1000);}}
  };
  const sc=SC[name];if(!sc){document.documentElement.dataset.err='unknown scene '+name;return;}
  const fresh=()=>{Object.assign(S,JSON.parse(JSON.stringify(START)));stack.length=0;VP.innerHTML='';cur=null;closeSheet(true);unnotify();$('#toast').classList.remove('show');sc.start();};
  const fade=async v=>{if(mode==='still')return;dev.style.transition='opacity .3s ease';dev.style.opacity=v;await sleep(320);};
  async function loop(){try{for(;;){fresh();await fade(1);await sleep(500);await sc.run();await sleep(2000);await fade(0);}}
    catch(e){if(e!==ABORT)document.documentElement.dataset.err=e.message||String(e);}}
  addEventListener('message',e=>{const m=e.data&&e.data.cvs;if(!m||mode==='still')return;
    if(m==='pause'){paused=true;document.documentElement.classList.add('paused');return;}
    if(m!=='play'&&m!=='restart')return;
    document.documentElement.classList.remove('paused');paused=false;
    if(m==='restart'||!started){started=true;gen++;loop();}});
  fresh();
  if(mode==='still'){paused=false;(async()=>{try{await sc.run();}catch(e){if(e!==ABORT)document.documentElement.dataset.err=e.message;}send({state:'still'});})();}
  else send({state:'ready'});
})();
</script>
