<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVS Eligible Spend Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141416; --sub:#5C6672; --ph:#6B7280; --line:#E3E3E3; --div:#EDEDED; --field:#8F8C89;
  --navy:#1E4B94; --link:#004D99; --red:#CC0000; --alert:#BB2619; --error:#C62828; --green:#127A3E; --check:#1F7A3D; --focus:#0B5FAF;
  --tag-bg:#E3EDF9; --tag-ink:#004D99; --tag-no-bg:#F1F1F3; --tag-no-ink:#5C6672;
  --wash-1:#DCE7F7; --wash-2:#E2EBF8; --wash-3:#EAF0FA; --panel:#F3F6FA; --star:#F26B21;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --sans:"Inter",system-ui,-apple-system,sans-serif; --sys:-apple-system,"SF Pro Text","SF Pro",system-ui,sans-serif;
}
:root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
:root:not([data-theme="light"]){color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#E7EAEF;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none}
input{font:inherit;color:inherit}

/* stage + device */
#stage{position:fixed;inset:0;display:grid;place-items:center}
#scaler{transform-origin:center center}
#device{position:relative;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#fff;box-shadow:0 0 0 10px #101114,0 0 0 11px #2A2C31,0 30px 60px rgba(16,24,40,.25)}
@media (max-width:440px){ body{background:#fff} #device{border-radius:0;box-shadow:none} }
#restart{position:fixed;top:16px;right:16px;font-size:13px;color:var(--sub);padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.7)}
@media (max-width:440px){ #restart{display:none} }

/* status bar */
#status{position:absolute;inset:0 0 auto 0;height:54px;z-index:60;pointer-events:none;font-family:var(--sys)}
#status .time{position:absolute;left:30px;top:16px;width:72px;text-align:center;font-weight:600;font-size:15.6px;letter-spacing:-.2px}
#status .island{position:absolute;left:118px;top:11px;width:149px;height:35px;border-radius:18px;background:#000}
#status .right{position:absolute;right:30px;top:20px;display:flex;gap:6px;align-items:center}
#status.dark{color:#fff}

/* screens */
#viewport{position:absolute;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;background:#fff;overflow:hidden;will-change:transform,opacity}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* transitions */
.t-in-right{animation:inRight .5s var(--ease) both}.t-out-left{animation:outLeft .5s var(--ease) both}
.t-in-left{animation:inLeft .5s var(--ease) both}.t-out-right{animation:outRight .5s var(--ease) both}
.t-in-fade{animation:fadeIn .3s ease-out both}.t-out-fade{animation:fadeOut .3s ease-out both}
.t-in-up{animation:inUp .45s var(--ease) both}.t-out-down{animation:outDown .45s var(--ease) both}
.t-hold{animation:hold .45s linear both}
@keyframes inRight{from{transform:translateX(100%)}to{transform:none}}
@keyframes outLeft{from{transform:none}to{transform:translateX(-30%);opacity:.6}}
@keyframes inLeft{from{transform:translateX(-30%);opacity:.6}to{transform:none;opacity:1}}
@keyframes outRight{from{transform:none}to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes inUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes outDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes hold{from{opacity:1}to{opacity:1}}

/* shared type */
.h1{font-size:30px;font-weight:700;letter-spacing:-.3px;line-height:34.5px;margin:0}
.body{font-size:15.6px;line-height:22.5px;margin:0}
.meta{font-size:12.2px;color:var(--sub)}
.label{font-size:15.6px;font-weight:700}
.sec{font-size:15.6px;font-weight:600}
.link{color:var(--link);font-weight:600}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;width:364.4px;height:39.3px;border-radius:19.65px;font-weight:700;font-size:15.6px}
.btn-primary{background:var(--navy);color:#fff}
.btn-outline{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 .9px var(--ink)}
.btn-primary:disabled{background:#E6E6E6;color:#5C5C5C;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
.pill{height:35.7px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 1px var(--ink);color:var(--navy);font-weight:700;font-size:15.6px;display:flex;align-items:center;justify-content:center}

/* tags */
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:12.2px;font-weight:600;background:var(--tag-bg);color:var(--tag-ink);white-space:nowrap}
.tag.no{background:var(--tag-no-bg);color:var(--tag-no-ink)}

/* headers */
.subhead{position:absolute;inset:0 0 auto 0;height:98.2px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.08);z-index:20}
.back{position:absolute;left:4px;top:58px;width:40px;height:40px;display:grid;place-items:center}
.subhead .title{position:absolute;left:0;right:0;top:66px;text-align:center;font-family:var(--sys);font-weight:600;font-size:17px}
.subhead .action{position:absolute;right:14px;top:67px;font-size:15.6px;color:var(--link)}
.heart{width:25.9px;height:21.1px;display:block}

/* fields */
.field{position:relative;width:364.4px;height:50.6px;border-radius:6.8px;box-shadow:inset 0 0 0 .9px var(--field);background:#fff;display:flex;align-items:center;padding:0 15.8px}
.field input{border:0;outline:0;background:transparent;width:100%;font-size:15.6px}
.field input::placeholder{color:var(--ph)}
.field.focus{box-shadow:inset 0 0 0 1.8px var(--focus)}
.field.error{box-shadow:inset 0 0 0 1.8px var(--error)}
.field.valid{box-shadow:inset 0 0 0 1.8px var(--green)}
.field .ok{position:absolute;right:14px;top:17px;opacity:0;transform:scale(.6);transition:all .22s var(--spring)}
.field.valid .ok{opacity:1;transform:none}
.err{color:var(--error);font-size:12.2px;margin-top:6px;min-height:0}

/* tab bar */
#tabbar{position:absolute;left:15px;top:767px;width:363px;height:55px;z-index:40;transition:transform .35s var(--ease),opacity .25s}
#tabbar.hidden{transform:translateY(120px);opacity:0;pointer-events:none}
#tabbar .home{position:absolute;left:0;top:0;width:65px;height:55px;border-radius:28px}
#tabbar .group{position:absolute;left:69px;top:0;width:294px;height:55px;border-radius:28px}
#tabbar .glass{background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 6px 20px rgba(16,24,40,.12),inset 0 0 0 1px rgba(255,255,255,.8)}
.tab{position:absolute;top:0;height:55px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#6E6E73}
.tab.on{color:var(--ink);font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-disabled="true"]{cursor:default}
#tabbar .home .tab{left:0;width:65px}
#tabbar .bar{position:absolute;top:-1px;height:3px;width:30px;border-radius:2px;background:var(--ink)}

/* overlay sheets */
#overlay{position:absolute;inset:0;z-index:50;pointer-events:none}
#overlay.open{pointer-events:auto}
.dim{position:absolute;inset:0;background:rgba(11,13,18,.42);opacity:0;transition:opacity .45s var(--ease)}
#overlay.open .dim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .45s var(--ease);box-shadow:0 -4px 24px rgba(0,0,0,.14)}
#overlay.open .sheet{transform:none}
.handle{width:36px;height:4px;border-radius:2px;background:#D0D3D8;margin:8px auto 0}

/* toast */
#toast{position:absolute;left:14.3px;right:14.3px;top:690px;z-index:55;background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(16,24,40,.16),inset 0 0 0 1px var(--line);padding:14px 16px;display:flex;gap:10px;align-items:center;font-size:15.6px;font-weight:600;transform:translateY(16px);opacity:0;transition:all .35s var(--ease);pointer-events:none}
#toast.show{transform:none;opacity:1}
#toast.act{pointer-events:auto}
#toast .ta{margin-left:auto;color:var(--link);font-weight:700;font-size:15.6px;padding:4px 2px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .qbtn:disabled{opacity:.35;cursor:default}
.qpick button{display:flex;align-items:center;justify-content:space-between;width:100%;height:48px;padding:0 18px;font-size:17px;border-top:1px solid var(--div)}
.qpick button[aria-current="true"]{font-weight:700;color:var(--navy)}

/* ---------- Benefits home ---------- */
.home-bg{position:absolute;left:0;right:0;top:0;height:1;pointer-events:none}
.bhead{position:absolute;inset:0 0 auto 0;height:209px;z-index:20;border-radius:0 0 24px 24px;background:linear-gradient(180deg,rgba(226,235,248,.92),rgba(234,240,250,.92));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 6px 20px rgba(16,24,40,.08),inset 0 -1px 0 rgba(255,255,255,.9)}
.wordmark{position:absolute;left:14.3px;top:60px;display:flex;align-items:center;gap:4px;color:var(--red);font-weight:800;font-size:20px;letter-spacing:-.5px}
.wordmark .section{position:relative;top:1.5px;margin-left:0;font-size:12.2px;font-weight:700;letter-spacing:0;color:var(--sub)}
.cartbtn{position:absolute;right:14.3px;top:55px;width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(16,24,40,.12)}
.badge{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;transform:scale(1)}
.badge.bump{animation:bump .4s var(--spring)}
@keyframes bump{0%{transform:scale(.6)}100%{transform:scale(1)}}
.search{position:absolute;left:14.3px;top:98px;width:364.4px;height:36px;border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 6px 0 12px;gap:8px;font-size:13.9px;color:#6E6E6E;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.search .ph{flex:1;text-align:left;white-space:nowrap;overflow:hidden}
.mic{position:relative;width:27px;height:28px;border-radius:8px;background:#0058C2;display:grid;place-items:center;overflow:hidden}
.mic::after{content:"";position:absolute;inset:-10px auto -10px -30px;width:18px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 2.5s linear .35s infinite}
@keyframes shine{0%{left:-30px}86%{left:44px}100%{left:44px}}
.seg{position:absolute;left:14.3px;top:146px;width:364.4px;height:44px;border-radius:14px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
.seg .thumb{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:38px;border-radius:11px;background:#F7F8FA;box-shadow:inset 0 0 0 1.5px var(--navy),0 1px 3px rgba(16,24,40,.08);transition:transform .7s var(--ease)}
.seg.hsa .thumb{transform:translateX(100%)}
.seg button{position:absolute;top:0;width:50%;height:44px;font-size:13.9px;color:#4A4A4A;z-index:1}
.seg button[aria-selected="true"]{font-weight:600;color:#151515}
.bcontent{position:relative;padding-top:229px;padding-bottom:120px}
.bgpat{position:absolute;left:0;top:0;opacity:.38;pointer-events:none;-webkit-mask-image:linear-gradient(#000 482px,transparent 572px);mask-image:linear-gradient(#000 482px,transparent 572px)}
.bg-wash{position:absolute;left:0;right:0;top:0;height:640px;background:linear-gradient(180deg,var(--wash-1) 0,var(--wash-2) 340px,var(--wash-3) 500px,#fff 600px)}
.hero{position:relative;padding:0 14.3px}
.hero .lbl{font-size:13.9px;color:var(--sub)}
.hero .amt{font-size:44px;font-weight:600;letter-spacing:-.5px;line-height:1.15;margin:2px 0 4px;font-variant-numeric:normal;font-feature-settings:normal}
.hero .acct{font-size:13.9px;color:var(--sub)}
.glass{position:relative;margin:24px 14.3px 0;width:364.4px;border-radius:16px;background:rgba(255,255,255,.38);box-shadow:inset 0 0 0 1px rgba(255,255,255,.95),0 2px 14px rgba(51,26,77,.05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:18px 15.5px 15.5px}
.glass .t{font-size:13.9px;font-weight:600}
.glass .k{font-size:13px;font-weight:700;margin-top:12px;font-variant-numeric:normal;font-feature-settings:normal}
.glass .k.red{color:var(--alert)}
.track{height:6px;border-radius:3px;background:#DDE6F3;margin-top:10px;overflow:hidden}
.track i{display:block;height:100%;background:var(--navy);border-radius:3px;transition:width .6s var(--ease)}
.glass .n{font-size:13.9px;color:var(--sub);margin-top:10px}
.glass .pills{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.row-title{display:flex;justify-content:space-between;align-items:baseline;padding:0 14.3px;margin:32px 0 16px}
.row-title h2{font-size:20px;font-weight:600;letter-spacing:-.3px;margin:0}
.row-title .link{font-size:13.9px}
.carousel{display:flex;gap:8px;overflow-x:auto;padding:0 14.3px 2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}

/* product card (CVS) */
.pcard{position:relative;flex:0 0 176.3px;height:321.3px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px #E8E8E8;scroll-snap-align:start;text-align:left}
.pcard .photo{position:absolute;left:16px;top:14px;right:16px;height:110px;background:#fff center/contain no-repeat}
.pcard .nm{position:absolute;left:11.4px;right:11px;top:146px;font-size:13.9px;line-height:17.6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .rt{position:absolute;left:10.1px;top:196px;display:flex;align-items:center;gap:2.1px}
.pcard .rt span{margin-left:6px;font-size:11px;color:#6E6E73}
.pcard .pr{position:absolute;left:10.7px;top:212px;font-size:13.9px}
.pcard .add{position:absolute;left:10px;right:10px;top:262.7px;height:48.9px;border-radius:24.45px;background:var(--link);color:#fff;font-size:13.9px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s}
.pcard .add.done{background:#fff;color:var(--link);box-shadow:inset 0 0 0 1px var(--link)}
.pcard .tagpos{position:absolute;left:10px;top:12px}

/* added to cart sheet */
.atc{height:796px;display:flex;flex-direction:column}
.atc h3{font-size:20px;font-weight:600;text-align:center;margin:14px 0 14px}
.atc .mid{flex:1;overflow-y:auto;border-top:1px solid var(--div);border-bottom:1px solid var(--div)}
.prow{display:flex;gap:14px;padding:18px 18px 16px;align-items:flex-start}
.thumb{flex:0 0 64px;height:64px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);background:#fff center/84% no-repeat}
.prow .nm{font-size:15.6px;font-weight:600;line-height:21px}
.prow .pr{font-size:20px;font-weight:700;margin-top:4px}
.elig{display:flex;gap:8px;align-items:flex-start;padding:0 18px 18px;font-size:13.9px;color:#3B3F45;border-bottom:1px solid var(--div)}
.fbt h4{font-size:15.6px;font-weight:600;margin:18px 14.3px 12px}
.fbt .carousel{padding-bottom:18px}
.atc .foot{padding:14px 14.3px 34px}
.atc .sub{text-align:center;font-weight:700;font-size:15.6px;margin-bottom:12px;font-variant-numeric:normal;font-feature-settings:normal}
.atc .foot .btn+.btn{margin-top:14.3px}

/* search */
.qbar{position:absolute;left:14.3px;top:60px;width:294.4px;height:34px;border-radius:12px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 10px;box-shadow:0 1px 2px rgba(16,24,40,.06);transition:all .35s var(--ease)}
.qbar input{border:0;outline:0;background:transparent;flex:1;font-size:13.9px;caret-color:var(--focus)}
.qbar input::placeholder{color:var(--ph)}
.cancel{position:absolute;right:14.3px;top:66px;font-size:15.6px;color:var(--link)}
.sugg{position:absolute;inset:118px 0 0 0;overflow-y:auto;padding:0 14.3px 300px}
.sugg h4{font-size:15.6px;font-weight:600;margin:6px 0 6px}
.sitem{display:flex;align-items:center;gap:12px;height:44px;width:100%;font-size:15.6px;border-bottom:1px solid var(--div)}
.sitem:last-of-type{border-bottom:0}
.sugg .group+.group{margin-top:18px}
.kb{position:absolute;left:0;right:0;bottom:0;height:289px;border-radius:22px 22px 28px 28px;background:rgba(240,240,243,.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 -2px 14px rgba(0,0,0,.06);transform:translateY(100%);transition:transform .35s var(--ease);z-index:30}
.kb.up{transform:none}
.kb .r{position:absolute;left:0;right:0;display:flex;gap:5.4px;justify-content:center}
.key{width:33.3px;height:40.2px;border-radius:8px;background:rgba(255,255,255,.96);font-size:22px;display:grid;place-items:center;font-family:var(--sys)}
.key:active{background:#DADDE3}
.key.wide{width:44.7px}.key.fn{width:42.9px;font-size:16px}.key.space{width:188.1px;position:relative}.key.go{width:91.4px;background:#3478F5}
.key.space small{position:absolute;left:0;right:0;text-align:center;bottom:4px;font-size:11px;color:#636366;font-weight:500}
.results{position:absolute;inset:118px 0 0 0;overflow-y:auto;padding:0 14.3px 120px}
.results .count{font-size:13.9px;color:var(--sub);margin:4px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .pcard{flex:none;width:auto}

/* scanner */
.scan{background:#000}
.scan .shead{position:absolute;inset:0 0 auto 0;height:104.5px;background:#fff;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.scan .shead .t{position:absolute;left:38px;top:66px;font-size:15.6px;font-weight:700}
.scan .ctl{position:absolute;top:132.5px;width:21px;height:21px}
.bracket{position:absolute;border:3.3px solid #fff;width:55px;height:55px;transition:all .35s var(--ease)}
.b-tl{border-right:0;border-bottom:0}.b-tr{border-left:0;border-bottom:0}.b-bl{border-right:0;border-top:0}.b-br{border-left:0;border-top:0}
.scanline{position:absolute;left:30px;right:30px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);box-shadow:0 0 12px rgba(255,255,255,.6);animation:sweep 1.4s ease-in-out infinite alternate}
@keyframes sweep{from{top:230px}to{top:360px}}
.hint{position:absolute;left:38.5px;top:402.5px;width:316px;min-height:45px;padding:6px 12px;text-align:center;border-radius:4px;background:rgba(255,255,255,.94);display:grid;place-items:center;font-size:13px;color:#1C1C1E;transition:opacity .25s}
.ssheet{position:absolute;left:0;right:0;top:555.6px;bottom:0;background:#fff;border-radius:20px 20px 0 0;transition:top .45s var(--ease)}
.ssheet .pad{padding:0 14.3px}
.verdict{display:flex;align-items:center;gap:10px;margin:22px 0 4px}
.verdict .tag{height:28px;padding:0 12px;font-size:13.9px;border-radius:14px;transform:scale(.6);opacity:0}
.verdict .tag.stamp{animation:stamp .45s var(--spring) .1s forwards}
@keyframes stamp{to{transform:scale(1);opacity:1}}
.verdict .why{font-size:13.9px;color:var(--sub);opacity:0;animation:fadeIn .3s ease-out .35s forwards}
.tick path{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .35s ease-out .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.how{position:absolute;left:7.1px;width:378.7px;top:432.9px;height:412px;border-radius:25.9px;background:#fff;transform:translateY(120%);transition:transform .45s var(--ease)}
.how.up{transform:none}

/* cart */
.ccard{margin:0 14.3px 12px;border-radius:12px;box-shadow:inset 0 0 0 1px #D9DCE1;padding:16px 14px 0}
.ccard .top{display:flex;gap:12px}
.ccard .nm{flex:1;font-size:17px;line-height:22px}

const VP=$('#viewport');let cur=null;const stack=[];

function show(name,opts={}){const t=reduce?'none':(opts.t||'push');const node=SCREENS[name](opts);node.dataset.name=name;
  closeSheet(true);const prev=cur;VP.appendChild(node);

function reflow(scr){const f=scr&&scr.querySelector('[data-flow]');if(!f)return;
  // content below the heading block always starts 24.3px under it (system gap); also absorbs text growth from user text spacing (1.4.12)
  const kids=[...f.parentElement.children].filter(e=>e!==f&&getComputedStyle(e).position==='absolute'&&parseFloat(e.style.top)>160&&parseFloat(e.style.top)<700);
  kids.forEach(e=>{if(e.dataset.top===undefined)e.dataset.top=parseFloat(e.style.top);});
  const first=Math.min(...kids.map(e=>+e.dataset.top));if(!isFinite(first))return;

    for(let x=r.left+12;x<r.right-8&&!dark;x+=14){for(const e of document.elementsFromPoint(x,y)){if(g.contains(e)||e.closest('#tabbar,.menubar,#status'))continue;

  const order=[['Savings',0],['Shop',73],['Benefits',146],['Orders',218]];
  T.innerHTML=`<div class="glassy" style="left:0;top:2px;width:65px;height:51px;border-radius:26px"><button class="tb homeb" data-go="home-start" aria-label="Home"><span class="ic">${FIG.tab_home}</span><span class="lb">Home</span></button></div>
   <div class="glassy" style="left:72px;top:0;width:291px;height:55px;border-radius:28px">${order.map(([k,x])=>{const key=k.toLowerCase(),on=key===active,live=key!=='savings';
     return `<button class="tb${on?' on':''}" style="left:${x}px;width:73px" ${live?`data-go="${key}"`:'aria-disabled="true" tabindex="-1"'} aria-label="${k}${live?'':' (not in this prototype)'}"${on?' aria-current="page"':''}>${on?'<i class="ind"></i>':''}<span class="ic">${FIG['tab_'+k+(on?'_on':'_off')]}</span><span class="lb">${k}</span></button>`;}).join('')}</div>`;
  $$('[data-go]',T).forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g===active)return;
    if(g==='home-start')go('start',{t:active==='shop'?'back':'fade'});
    if(g==='shop')go('shop',{t:'fade'});

const OV=$('#overlay');
function openSheet(node,{floating=false,onClose}={}){closeSheet(true);node.classList.add(floating?'how':'sheet');OV.appendChild(node);OV._onClose=onClose;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{OV.classList.add('open');if(floating)node.classList.add('up');}));
  OV.querySelector('.dim').onclick=()=>closeSheet();node.querySelector('[data-autofocus]')?.focus({preventScroll:true});}
function closeSheet(instant){const s=OV.querySelector('.sheet,.how');if(!s){OV.classList.remove('open');return;}
  OV.classList.remove('open');s.classList.remove('up');const cb=OV._onClose;OV._onClose=null;
  if(instant===true){s.remove();return;}setTimeout(()=>s.remove(),460);cb&&cb();}
function toast(html){const T=$('#toast');T.innerHTML=html;T.classList.add('show');say(T.textContent);clearTimeout(T._t);T._t=setTimeout(()=>T.classList.remove('show'),2600);}
function badges(bump){$$('.badge').forEach(b=>{const n=cartQty();b.textContent=n;b.style.display=n?'grid':'none';if(bump){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}});}

/* ===================== product card ===================== */
const IMG=k=>`img/${k}.jpg`;const th=(k,extra='')=>`<div class="thumb" style="background-image:url(${IMG(k)});${extra}"></div>`;
function pcard(k,{tag=false,inline=false}={}){const p=P[k];
  return `<div class="pcard" data-k="${k}"><div class="photo" style="background-image:url(${IMG(k)})"></div>${tag?`<span class="tag tagpos${p.e?'':' no'}">${p.e?'FSA/HSA':'Not eligible'}</span>`:''}
  <div class="nm">${p.n}</div><div class="rt" aria-label="${p.r} out of 5 stars">${stars(p.r)}<span>${p.c}</span></div><div class="pr">${money(p.p)}</div>
  <button class="add" data-add="${k}" ${inline?'data-inline':''} aria-label="Add ${p.n} to cart">Add To Cart</button></div>`;}
function wireCards(node){$$('[data-add]',node).forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.dataset.add;S.cart[k]=(S.cart[k]||0)+1;
  if(b.hasAttribute('data-inline')){b.classList.add('done');b.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Added`;b.disabled=true;
    badges(true);const sub=$('.atc .sub .num');if(sub){const t=cartTotals().t;roll(sub,+sub.dataset.v,t,380);sub.dataset.v=t;}const vc=$('.atc [data-viewcart]');if(vc)vc.textContent=`View cart and checkout (${cartQty()} item${cartQty()>1?'s':''})`;say('Added to cart');}
  else{badges(true);addedSheet(k);}});}

/* ===================== Added to cart sheet ===================== */
function addedSheet(k){const p=P[k];const row=ROWS.find(r=>r[1].includes(k));const pool=row?row[1].filter(x=>x!==k):['Bandages','Advil'];
  const fbt=[...pool,...ROWS.flatMap(r=>r[1]).filter(x=>x!==k&&!pool.includes(x))].slice(0,2);const tot=cartTotals().t;
  const n=el(`<div class="atc" role="dialog" aria-modal="true" aria-label="Added to cart"><div class="handle"></div><h3 tabindex="-1" data-autofocus>Added to cart</h3>
   <div class="mid"><div class="prow">${th(k)}<div><div class="nm">${p.n}</div><div class="pr">${money(p.p)}</div></div></div>
   <div class="elig">${p.e?ICON.check(18)+'<span>FSA/HSA eligible · paid automatically at checkout</span>':'<span class="tag no">Not eligible</span><span>Pay for this with another card</span>'}</div>
   <div class="fbt"><h4>Frequently bought together</h4><div class="carousel">${fbt.map(x=>pcard(x,{inline:true})).join('')}</div></div></div>
   <div class="foot"><div class="sub">Subtotal: <span class="num" data-v="${tot}">${money(tot)}</span></div>
   <button class="btn btn-primary" data-viewcart>View cart and checkout (${cartQty()} item${cartQty()>1?'s':''})</button><button class="btn btn-outline" data-continue>Continue shopping</button></div></div>`);
  openSheet(n);wireCards(n);n.querySelector('[data-viewcart]').onclick=()=>{closeSheet();setTimeout(()=>go('cart'),200);};n.querySelector('[data-continue]').onclick=()=>closeSheet();say(`${p.n} added to cart`);}

  <svg style="position:absolute;left:51px;top:127px" width="292" height="280" viewBox="0 0 292 280" aria-hidden="true"><defs><clipPath id="notch"><rect x="0" y="0" width="189" height="228" rx="15"/><rect x="45" y="75" width="247" height="205" rx="15"/></clipPath></defs><image href="${HERO}" width="292" height="280" clip-path="url(#notch)" preserveAspectRatio="xMidYMid slice"/></svg>

SCREENS.providers=()=>{const prov=[['WEX','FSA, HSA, HRA'],['HealthEquity','FSA, HSA, HRA'],['Fidelity','HSA'],['Optum Financial','FSA, HSA'],['HSA Bank','HSA'],['PayFlex','FSA, HSA']];
  const n=el(setup(`<div data-flow data-gap="24.3" style="position:absolute;left:14.3px;top:160px;width:364.4px"><h1 class="h1" tabindex="-1" data-autofocus>Find your provider</h1>
  <p class="body" style="margin:33.5px 0 0">Step 1 of 2. Log in with your provider to see your balance and deadlines.</p></div>
  <label class="field" style="position:absolute;left:14.3px;top:297px"><span style="color:#5C6672;margin-right:10px">${ICON.search}</span><input placeholder="Search your provider" aria-label="Search your provider" data-filter></label>
  <div data-list style="position:absolute;left:14.3px;top:363.6px;width:364.4px;border-radius:6.8px;box-shadow:inset 0 0 0 .9px #8F8C89">${prov.map(([a,b],i)=>`<button data-p="${a}" style="display:flex;align-items:center;width:100%;height:58px;padding:0 16px;text-align:left;${i?'border-top:1px solid #EDEDED':''}"><span style="flex:1"><span style="display:block;font-size:15.6px">${a}</span><span class="meta">${b}</span></span>${ICON.chev}</button>`).join('')}</div>
  <p class="meta" style="position:absolute;left:14.3px;top:728px;width:364px;display:flex;gap:6px;margin:0">${ICON.lock}<span>You log in directly with your provider. CVS never sees your password and only receives your balance and plan dates.</span></p>`));
  n.querySelector('[data-filter]').oninput=e=>{const q=e.target.value.toLowerCase();$$('[data-p]',n).forEach(b=>b.style.display=b.dataset.p.toLowerCase().includes(q)?'flex':'none');};
  $$('[data-p]',n).forEach(b=>b.onclick=()=>loginSheet(b.dataset.p));wireCommon(n);return n;};
function loginSheet(prov){const n=el(`<div role="dialog" aria-modal="true" aria-label="Log in to ${prov}" style="height:422px"><div class="handle"></div>
  <div class="meta" style="text-align:center;margin-top:8px">${prov.toLowerCase().replace(/\s/g,'')}.com</div>
  <div style="padding:0 14.3px"><div style="font-size:20px;font-weight:600;margin:22px 0 18px" tabindex="-1" data-autofocus>Log in to ${prov}</div>
  <div class="label">Username</div><div class="field" style="margin-top:8px"><input value="echen" aria-label="Username"></div>
  <div class="label" style="margin-top:24px">Password</div><div class="field" style="margin-top:8px"><input type="password" value="password12" aria-label="Password"></div>
  <button class="btn btn-primary" style="margin-top:24px" data-login>Log in</button>
  <button style="display:block;margin:16px auto 0;font-size:13.9px;font-weight:600;color:var(--navy)">Forgot username or password?</button></div></div>`);
  openSheet(n);n.querySelector('[data-login]').onclick=()=>{const b=n.querySelector('[data-login]');b.innerHTML='<span class="spin"></span>';b.disabled=true;setTimeout(()=>{closeSheet(true);go('connected',{t:'fade'});},900);};}

  const E='cubic-bezier(.4,.2,.15,1)';
  at(t,()=>{H.animate([{left:'173.15px'},{left:'46px'}],{duration:700,easing:E,fill:'forwards'});
    C.animate([{left:'196.65px',width:'196.35px'},{left:'69.1px',width:'323.9px'}],{duration:700,easing:E,fill:'forwards'});
    W.animate([{left:'-287.6px'},{left:'0px'}],{duration:700,easing:E,fill:'forwards'});});
  t+=700+300;
  at(t,()=>{d.animate([{opacity:1},{opacity:0}],{duration:200,easing:'ease-out',fill:'forwards'});at(220,()=>d.remove());});}
$('#restart').onclick=()=>{boot();splash();};if(!EMBED){boot();splash();}
</script>
<style>
/* Embedded in the case study, the page draws the phone around this, so the
   device loses its own frame and fills the iframe edge to edge. */
html.embed,html.embed body{background:transparent}
html.embed #restart{display:none}
html.embed #device{border-radius:0;box-shadow:none}
/* The stage centres the device with grid, but in a frame smaller than the
   device the grid track grows to the device's full size, and scaling about
   its centre then leaves it pushed right and down. Pin its centre instead. */
html.embed #scaler{position:absolute;left:50%;top:50%;margin:-426px 0 0 -196.5px}
/* Where a scripted tap lands. Without it a scene is a screen changing on its
   own, and the reader cannot tell which control caused it. */
.tapdot{position:absolute;z-index:90;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(17,17,20,.16);box-shadow:0 0 0 1.5px rgba(255,255,255,.85);opacity:0;pointer-events:none}
.tapdot.on{animation:tapdot .62s var(--ease) both}
@keyframes tapdot{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1)}45%{opacity:1;transform:scale(.86)}100%{opacity:0;transform:scale(1.04)}}
.taplock{position:absolute;inset:0;z-index:95}
/* The register reading the checkout barcode, marked the way the case study's
   page marks what is current, in its rail and its Work and Play pill: a 1px
   black outline round the thing, rounded, with no colour of its own. */
.scanmark{position:absolute;z-index:91;border:1px solid #000;border-radius:10px;pointer-events:none;opacity:0}
/* Paused from the page: the prototype's own CSS loops (the scan line, the mic
   shimmer) hold too. */
html.paused *,html.paused *::before,html.paused *::after{animation-play-state:paused!important}
/* Stop, and readers who ask for reduced motion: every transition finishes at
   once, so a scene lands on its last frame without anything moving. */
html.still *,html.still *::before,html.still *::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0s!important}
html.still .scanline,html.still .mic::after,html.still .tapdot{display:none}
</style>
<script>
/* ===================== embedded scenes =====================
   The case study shows this prototype one step at a time, each step in its own
   iframe: cvs-prototype.html?embed&scene=<name>[&mode=still]

   By default a scene shows its first frame and waits. The page then sends:
     {cvs:'play'}     start the loop, or carry on after a pause
     {cvs:'pause'}    hold where it is
     {cvs:'restart'}  start the loop over from the first frame
   The loop runs the scene by tapping the real controls, so every animation on
   the page is the prototype's own, holds the last frame, fades, and repeats.

   mode=still lands on the last frame with motion off, for readers whose system
   asks for reduced motion and for rendering the page's stills.

   The page hears {cvs:'state', state:'ready'|'still'}, and {cvs:'event', name}
   from scenes that keep time with something on the page. */
if(EMBED)(()=>{
  const q=new URLSearchParams(location.search),name=q.get('scene');let mode=q.get('mode')||'start';
  if(reduce)mode='still';
  if(mode==='still'){reduce=true;document.documentElement.classList.add('still');}
  const send=o=>{try{parent.postMessage(Object.assign({cvs:'state',scene:name},o),'*');}catch(e){}};
  const event=n=>send({cvs:'event',name:n});
  addEventListener('error',e=>{document.documentElement.dataset.err=e.message;});
  /* A looping scene should not read itself out to a screen reader. The page's
     caption already says what the step shows. */
  $('#live').removeAttribute('aria-live');$('#toast').removeAttribute('aria-live');$('#toast').removeAttribute('role');

  const dev=$('#device');
  const dot=el('<div class="tapdot" aria-hidden="true"></div>');dev.appendChild(dot);
  /* The loop owns the screen, so a stray tap cannot knock it off its script.
     The full prototype is a link away on the page for anyone who wants to use it. */
  dev.appendChild(el('<div class="taplock" aria-hidden="true"></div>'));

  /* One clock that only runs while the scene is playing. `gen` changes when
     the page asks for a restart, and anything still waiting from the old loop
     sees that and stops. */
  let paused=true,started=false,gen=0;const ABORT={};
  const sleep=ms=>{const g=gen;let left=mode==='still'?0:ms;return new Promise((res,rej)=>{(function t(){if(g!==gen)return rej(ABORT);if(left<=0)return res();
    setTimeout(()=>{if(!paused)left-=40;t();},40);})();});};
  /* Sheets first, then the screen on top, then the tab bar. During a push the
     outgoing screen is still in the DOM, so a bare querySelector can find a
     button on the page that is leaving. */
  const find=sel=>{for(const r of [OV.querySelector('.sheet,.how'),cur,$('#tabbar')]){if(!r)continue;if(r.matches(sel))return r;const e=r.querySelector(sel);if(e)return e;}return null;};
  async function get(sel){const g=gen;let waited=0;for(;;){if(g!==gen)throw ABORT;const e=find(sel);if(e&&!e.disabled)return e;
    await new Promise(r=>setTimeout(r,50));if(!paused)waited+=50;if(waited>9000)throw new Error('scene '+name+': nothing matched '+sel);}}
  const at=e=>{const d=dev.getBoundingClientRect(),r=e.getBoundingClientRect(),k=d.width/393;return{x:(r.left-d.left)/k,y:(r.top-d.top)/k,w:r.width/k,h:r.height/k};};
  async function tap(sel){const e=await get(sel);
    if(mode!=='still'){const p=at(e);dot.style.left=p.x+p.w/2+'px';dot.style.top=p.y+p.h/2+'px';
      dot.classList.remove('on');void dot.offsetWidth;dot.classList.add('on');await sleep(270);}
    e.click();}
  async function reveal(sel){const e=await get(sel),s=e.closest('.scroll');if(!s)return;const k=dev.getBoundingClientRect().width/393;
    const er=e.getBoundingClientRect(),sr=s.getBoundingClientRect();
    s.scrollTo({top:s.scrollTop+(er.top-sr.top)/k-s.clientHeight/2+er.height/k/2,behavior:mode==='still'?'auto':'smooth'});await sleep(750);}
  /* The register's scanner reading the barcode: a red line passing down it. */
  async function scanBeam(sel){const e=await get(sel);if(mode==='still')return;const p=at(e);
    const m=el('<div class="scanmark" aria-hidden="true"></div>');m.style.left=(p.x-8)+'px';m.style.top=(p.y-8)+'px';m.style.width=(p.w+16)+'px';m.style.height=(p.h+16)+'px';dev.appendChild(m);
    m.animate([{opacity:0,transform:'scale(1.03)'},{opacity:1,transform:'scale(1)',offset:.25},{opacity:1,transform:'scale(1)',offset:.75},{opacity:0,transform:'scale(1)'}],{duration:1100,easing:'ease-out'});
    await sleep(1120);m.remove();}

  /* Each scene is the step of the flow the case study is talking about at that
     point, and starts on the screen the reader saw last. */
  const SC={
    connect:{start(){S.connected=false;go('intro',{t:'none'});},
      async run(){await sleep(900);await tap('[data-connect]');await sleep(1300);await tap('[data-p="WEX"]');await sleep(1300);await tap('[data-login]');
        await get('[aria-label="Connected"]');await sleep(600);}},
    home:{start(){go('home',{t:'none'});},
      async run(){await sleep(1000);await tap('[data-acct="hsa"]');await sleep(2200);await tap('[data-acct="fsa"]');await sleep(900);}},
    scan:{start(){go('home',{t:'none'});},
      async run(){await sleep(900);await tap('[data-scanbtn2]');await get('.verdict .tag');await sleep(2400);await tap('[data-next]');
        await get('.verdict .tag.no');await sleep(900);}},
    cart:{start(){go('cart',{t:'none'});},
      async run(){await sleep(1000);await tap('[data-item="Bandages"] [data-plus]');await sleep(1600);await tap('[data-item="Hershey"] [data-minus]');await sleep(1400);}},
    /* Paired with the register screen beside it on the page. The page moves the
       register on each pos:<step> event, so the two run off this one clock. */
    handoff:{start(){go('checkout',{t:'none'});},
      async run(){await get('[data-num][style*="visible"]');await sleep(700);await scanBeam('[data-bc]');event('pos:scan');await sleep(700);
        event('pos:2');await sleep(2600);event('pos:3');await sleep(2600);event('pos:4');await sleep(2600);event('pos:5');await sleep(1600);
        await reveal('[data-done]');await tap('[data-done]');await sleep(1600);await tap('[data-go="benefits"]');await sleep(2200);}},
    receipt:{start(){go('orders',{t:'none',fsaOnly:true});},
      async run(){await sleep(1000);await tap('[data-o="o1"]');await sleep(1500);await tap('[data-dl]');await sleep(1600);}},
    /* Stills only. The case study's static screens are rendered from these at
       the size of the phone frame's screen, so they are as sharp as the live
       steps beside them rather than screenshots resized by a mockup tool. */
    providers:{start(){S.connected=false;go('providers',{t:'none'});},async run(){}},
    eligible:{start(){go('home',{t:'none'});},async run(){await tap('[data-scanbtn2]');await get('.verdict .tag');}},
    receiptsheet:{start(){go('orders',{t:'none',fsaOnly:true});},async run(){await tap('[data-o="o1"]');await get('[data-dl]');}}
  };
  const sc=SC[name];if(!sc){document.documentElement.dataset.err='unknown scene '+name;return;}

  const fresh=()=>{Object.assign(S,JSON.parse(JSON.stringify(START)));S.connected=true;S.howSeen=true;S.homeHealth=false;
    stack.length=0;VP.innerHTML='';cur=null;closeSheet(true);$('#toast').classList.remove('show','act');sc.start();};
  /* Between loops the screen fades to the page's still of the first frame,
     which sits behind the iframe, and comes back up on that same frame live. */
  const fade=async v=>{if(mode==='still')return;dev.style.transition='opacity .3s ease';dev.style.opacity=v;await sleep(320);};

  async function loop(){try{for(;;){fresh();event('loop');await fade(1);await sleep(500);await sc.run();await sleep(2000);await fade(0);}}
    catch(e){if(e!==ABORT)document.documentElement.dataset.err=e.message||String(e);}}

  addEventListener('message',e=>{const m=e.data&&e.data.cvs;if(!m||mode==='still')return;
    if(m==='pause'){paused=true;document.documentElement.classList.add('paused');return;}
    if(m!=='play'&&m!=='restart')return;
    document.documentElement.classList.remove('paused');paused=false;
    if(m==='restart'||!started){started=true;gen++;loop();}});

  fresh();
  if(mode==='still'){paused=false;(async()=>{try{await sc.run();}catch(e){if(e!==ABORT)document.documentElement.dataset.err=e.message;}
    event('pos:5');send({state:'still'});})();}
  else send({state:'ready'});
})();
</script>
</body>
