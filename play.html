  <script>
    (function () {
      var stage = document.getElementById('stage');
      var ring  = document.getElementById('ring');
      var hint  = document.getElementById('hint');
      if (!stage || !ring) return;

      var panels = ring.querySelectorAll('.panel');
      var count  = panels.length;
      var step   = 360 / count;            // a closed ring, so the motion never runs out
      var turns  = 2;                      // full revolutions across the scroll range
      var cutoff = 50;                     // only four unique works, so never show a fifth slot: it would repeat one
      var ticking = false;

      ring.style.setProperty('--step', step);

      function apply() {
        ticking = false;
        var box   = stage.getBoundingClientRect();
        var range = stage.offsetHeight - window.innerHeight;
        var p     = range > 0 ? (-box.top) / range : 0;
        p = p < 0 ? 0 : (p > 1 ? 1 : p);

        var rot = -p * turns * 360;
        ring.style.setProperty('--rot', rot.toFixed(3) + 'deg');

        for (var i = 0; i < count; i++) {
          var ang = i * step + rot;
          ang = ((ang % 360) + 540) % 360 - 180;   // normalise to -180..180
          var away = Math.abs(ang);
          if (away > cutoff) {
            panels[i].style.visibility = 'hidden';
          } else {
            panels[i].style.visibility = 'visible';
            panels[i].style.setProperty('--dim', (1 - (away / cutoff) * 0.3).toFixed(3));
          }
        }
        if (hint) hint.style.opacity = p > 0.03 ? '0' : '';
      }

      function onScroll() {
        if (!ticking) { ticking = true; window.requestAnimationFrame(apply); }
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      apply();
    })();
  </script>
