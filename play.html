  <!-- A closer look at one piece. Empty until something is opened, so the full
       size file is only fetched when it is actually asked for. -->

  <script>
    /* A gallery built as a rounded rectangle rather than a circle.

       The works hang along the perimeter of a room: two long side walls running
       away from the viewer, two rounded corners, and a short back wall. Each
       work is laid out by arc length along that path, so one that happens to
       straddle a corner physically bends around it. That fold is the point, and
       it is why a plain cylinder never looked right.

       Every picture is rebuilt as a run of narrow vertical facets. Each facet
       samples two neighbouring points on the path, takes its width from the
       distance between them and its angle from their direction, so the sheet
       follows the wall exactly: flat along the straight runs, curving through
       the corners. The texture is mapped by arc length, which stretches a work
       slightly along the side walls.

       The camera sits 2000px back looking at the origin and the room is measured
       in pixels, so a CSS perspective of 2000px reproduces the projection 1:1. */
    (function () {
      var stage = document.getElementById('stage');
      var room  = document.getElementById('room');
      var hint  = document.getElementById('hint');
      if (!stage || !room) return;

      var FACETS    = 22;     // vertical slices per work
      var SIDESCALE = 1.25;   // side walls are traversed faster than the back
      var EASE      = 0.12;
      var PER_PX    = 1.0;    // one pixel of gesture, one unit along the path
      var PAD       = 1.25;   // overlap between neighbouring facets, in pixels

      var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var viewerOpen = false;
      var works = [];
      var geom  = null;
      var cycle = 0;
      var target = 0, current = 0, frame = null, touched = false;

      // Blends the corner parameter between the two scales either side of it, so
      // a work does not visibly change speed as it turns the corner.
      function cornerAngle(t, a, b) {
        return Math.PI * (a * t + (b - a) * (Math.pow(t, 3) - Math.pow(t, 4) / 2)) / (a + b);
      }

      function measure() {
        var vw = stage.clientWidth, vh = stage.clientHeight;
        var base = Math.min(0.6 * vh, 560);
        var sum = 0;
        for (var i = 0; i < works.length; i++) {
          works[i].h = base;
          works[i].w = base * works[i].aspect;
          sum += works[i].w;
        }
        var d = sum / works.length;
        var W = 1.92 * d * 1.2;
        var D = 4.5 * d;
        var F = Math.max(0, Math.min(2000 * (1 - W / vw) + 200, 1200));
        var R = Math.max(0, Math.min(0.75 * d, W / 2, D + F));
        var side   = (D + F - R) / SIDESCALE;
        var corner = Math.PI * R / (SIDESCALE + 1);
        var back   = W - 2 * R;

        geom = { W: W, D: D, F: F, R: R, side: side, corner: corner, back: back,
                 length: 2 * side + 2 * corner + back, gap: 0.6 * d, d: d };

        var run = 0;
        for (var j = 0; j < works.length; j++) {
          works[j].centre = run + works[j].w / 2;
          run += works[j].w + geom.gap;
        }
        cycle = Math.max(run, geom.length + 2 * d);
      }

      // Where a given distance along the perimeter lands in the room.
      function pointAt(s, out) {
        var u = Math.max(0, Math.min(s, geom.length));
        if (u <= geom.side) {
          out.x = -geom.W / 2; out.z = geom.F - u * SIDESCALE; return;
        }
        u -= geom.side;
        if (u <= geom.corner) {
          var a = cornerAngle(u / geom.corner, SIDESCALE, 1);
          out.x = -geom.W / 2 + geom.R - geom.R * Math.cos(a);
          out.z = -geom.D + geom.R - geom.R * Math.sin(a);
          return;
        }
        u -= geom.corner;
        if (u <= geom.back) {
          out.x = -geom.W / 2 + geom.R + u; out.z = -geom.D; return;
        }
        u -= geom.back;
        if (u <= geom.corner) {
          var b = cornerAngle(u / geom.corner, 1, SIDESCALE);
          out.x = geom.W / 2 - geom.R + geom.R * Math.sin(b);
          out.z = -geom.D + geom.R - geom.R * Math.cos(b);
          return;
        }
        u -= geom.corner;
        out.x = geom.W / 2; out.z = -geom.D + geom.R + u * SIDESCALE;
      }

      // True when a span touches either rounded corner, and so has to bend.
      function crossesCorner(a, b) {
        var c1a = geom.side, c1b = c1a + geom.corner;
        var c2a = c1b + geom.back, c2b = c2a + geom.corner;
        return (b > c1a && a < c1b) || (b > c2a && a < c2b);
      }

      var p0 = { x: 0, z: 0 }, p1 = { x: 0, z: 0 };

      function layout(work, head) {
        var span = work.w;
        if (head + span <= 0 || head >= geom.length) {
          if (work.shown) { work.el.style.visibility = 'hidden'; work.shown = false; }
          return;
        }
        if (!work.shown) { work.el.style.visibility = 'visible'; work.shown = true; }

        // A work lying wholly on a straight wall needs no slicing, and slicing
        // it is actively harmful: the facets come out coplanar, and overlapping
        // coplanar layers z-fight into the thin pale streaks that were showing
        // down each poster. Only a work actually crossing a corner is cut up,
        // and there the facets sit at different angles so the overlap is clean.
        var curved = crossesCorner(head, head + span);
        var cuts = curved ? FACETS : 1;
        var pad  = curved ? PAD : 0;

        for (var i = 0; i < FACETS; i++) {
          var f = work.facets[i];
          if (i >= cuts) { f.style.display = 'none'; continue; }
          f.style.display = '';

          pointAt(head + span * i / cuts, p0);
          pointAt(head + span * (i + 1) / cuts, p1);
          var dx = p1.x - p0.x, dz = p1.z - p0.z;
          var len = Math.sqrt(dx * dx + dz * dz) || 0.01;
          var ang = Math.atan2(-dz, dx) * 180 / Math.PI;
          var cx = (p0.x + p1.x) / 2, cz = (p0.z + p1.z) / 2;

          f.style.width = (len + pad * 2).toFixed(2) + 'px';
          f.style.height = work.h.toFixed(2) + 'px';
          f.style.backgroundSize = (len * cuts).toFixed(2) + 'px 100%';
          f.style.backgroundPosition = (pad - i * len).toFixed(2) + 'px 0';
          f.style.transform =
            'translate3d(' + (cx - len / 2 - pad).toFixed(2) + 'px,' +
            (-work.h / 2).toFixed(2) + 'px,' + cz.toFixed(2) + 'px) ' +
            'rotateY(' + ang.toFixed(3) + 'deg)';
        }

        pointAt(head + 1, p0);
        pointAt(head + 2, p1);
        var cang = Math.atan2(-(p1.z - p0.z), p1.x - p0.x) * 180 / Math.PI;
        work.cap.style.transform =
          'translate3d(' + p0.x.toFixed(2) + 'px,' + (work.h / 2 + 16).toFixed(2) +
          'px,' + p0.z.toFixed(2) + 'px) rotateY(' + cang.toFixed(3) + 'deg)';
      }

      function draw(offset) {
        for (var i = 0; i < works.length; i++) {
          var w = works[i];
          var r = (w.centre - offset) % cycle;
          if (r < 0) r += cycle;
          var half = w.w / 2;
          if (r - half >= geom.length) {
            var alt = r - cycle;
            if (alt + half > 0) r = alt;
          }
          layout(w, r - half);
        }
      }

      function tick() {
        current += (target - current) * EASE;
        if (Math.abs(target - current) < 0.05) current = target;
        draw(current);
        frame = (current === target) ? null : window.requestAnimationFrame(tick);
      }

      function turn(units) {
        target += units;
        if (!touched && hint) { touched = true; hint.style.opacity = '0'; }
        if (still) { current = target; draw(current); return; }
        if (!frame) frame = window.requestAnimationFrame(tick);
      }

      function build() {
        var figures = room.querySelectorAll('.work');
        works = [];
        for (var i = 0; i < figures.length; i++) {
          var fig = figures[i];
          var img = fig.querySelector('img');
          if (!img || !img.naturalWidth) return;
          var holder = fig.querySelector('.work-art');
          var src = img.getAttribute('src');
          holder.textContent = '';
          var facets = [];
          for (var j = 0; j < FACETS; j++) {
            var f = document.createElement('span');
            f.className = 'facet';
            f.style.backgroundImage = 'url(' + JSON.stringify(src) + ')';
            holder.appendChild(f);
            facets.push(f);
          }
          holder.setAttribute('role', 'img');
          holder.setAttribute('aria-label', img.getAttribute('alt') || '');
          works.push({
            el: fig, cap: fig.querySelector('.work-cap'), facets: facets,
            aspect: img.naturalWidth / img.naturalHeight,
            src: src, alt: img.getAttribute('alt') || '',
            shown: true, w: 0, h: 0, centre: 0
          });
        }
        measure();
        draw(current);
      }

      var imgs = room.querySelectorAll('.work img');
      var waiting = imgs.length;
      function ready() { if (--waiting <= 0) build(); }
      for (var k = 0; k < imgs.length; k++) {
        if (imgs[k].complete && imgs[k].naturalWidth) ready();
        else imgs[k].addEventListener('load', ready, { once: true });
      }

      /* ---------- a closer look ---------- */

      /* The room is a room: at that size and angle a piece is something you
         notice rather than something you can read. Clicking one lifts it out
         flat and fits it to the frame, so the whole of it is visible at once
         whatever shape it is. */
      var viewer = document.getElementById('viewer');
      var vImg = document.getElementById('viewer-img');
      var vCap = document.getElementById('viewer-cap');
      var lastFocus = null;
      var closingIn = null;

      function openViewer(work) {
        if (!work) return;
        window.clearTimeout(closingIn);
        viewer.classList.remove('is-closing');
        vImg.setAttribute('src', work.src);
        vImg.setAttribute('alt', work.alt);
        // Years only, as on the wall.
        vCap.textContent = work.cap ? work.cap.textContent.trim() : '';
        viewer.hidden = false;
        viewerOpen = true;
        lastFocus = document.activeElement;
        viewer.focus();
      }

      // The overlay is left on screen for the length of its closing animation
      // and only then hidden, so it fades out rather than blinking off.
      function closeViewer() {
        if (!viewerOpen) return;
        viewerOpen = false;
        if (still) { endClose(); return; }
        viewer.classList.add('is-closing');
        closingIn = window.setTimeout(endClose, 270);
      }

      function endClose() {
        window.clearTimeout(closingIn);
        viewer.classList.remove('is-closing');
        viewer.hidden = true;
        // Letting the src go lets the browser drop the full size decode too.
        vImg.removeAttribute('src');
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }

      // One listener on the room rather than one per facet. There are twenty
      // two facets to a piece and they are rebuilt on every resize.
      room.addEventListener('click', function (e) {
        var fig = e.target && e.target.closest ? e.target.closest('.work') : null;
        if (!fig) return;
        for (var i = 0; i < works.length; i++) {
          if (works[i].el === fig) { openViewer(works[i]); return; }
        }
      });

      // Anywhere but the picture closes it, which includes the ground around it.
      viewer.addEventListener('click', function (e) {
        if (e.target !== vImg) closeViewer();
      });

      // The page itself never scrolls, so every gesture turns the room instead.
      stage.addEventListener('wheel', function (e) {
        e.preventDefault();
        if (viewerOpen) return;
        var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        turn(d * PER_PX);
      }, { passive: false });

      var lastX = null, lastY = null;
      stage.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) return;
        lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      }, { passive: true });

      stage.addEventListener('touchmove', function (e) {
        if (viewerOpen) return;
        if (lastX === null || e.touches.length !== 1) return;
        e.preventDefault();
        var x = e.touches[0].clientX, y = e.touches[0].clientY;
        var dx = x - lastX, dy = y - lastY;
        turn((Math.abs(dx) > Math.abs(dy) ? -dx : dy) * PER_PX * 1.6);
        lastX = x; lastY = y;
      }, { passive: false });

      stage.addEventListener('touchend', function () { lastX = null; lastY = null; }, { passive: true });

      window.addEventListener('keydown', function (e) {
        var k = e.key;
        if (k === 'Escape') { closeViewer(); return; }
        if (viewerOpen) return;
        if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown') { e.preventDefault(); turn(240); }
        else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); turn(-240); }
      });

      var pending = null;
      window.addEventListener('resize', function () {
        window.clearTimeout(pending);
        pending = window.setTimeout(function () {
          if (!works.length) return;
          measure();
          draw(current);
        }, 140);
      });
    })();
  </script>
