  <script>
    (function () {
      var ring = document.getElementById('ring');
      var hint = document.getElementById('hint');
      var stage = document.getElementById('stage');
      if (!ring || !stage) return;

      var panels = ring.querySelectorAll('.panel');
      var count  = panels.length;
      var step   = 360 / count;   // a closed ring, so the motion never runs out
      var cutoff = 50;            // past this a panel is beside or behind the eye
      var ease   = 0.09;          // how quickly the ring catches up to the gesture
      var perPx  = 0.10;          // degrees per pixel of scroll or swipe

      var still  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var target = 0, current = 0, frame = null, touched = false;

      ring.style.setProperty('--step', step);

      function draw(rot) {
        ring.style.setProperty('--rot', rot.toFixed(3) + 'deg');
        for (var i = 0; i < count; i++) {
          var ang = i * step + rot;
          ang = ((ang % 360) + 540) % 360 - 180;
          var away = Math.abs(ang);
          if (away > cutoff) {
            panels[i].style.visibility = 'hidden';
          } else {
            panels[i].style.visibility = 'visible';
            panels[i].style.setProperty('--dim', (1 - (away / cutoff) * 0.3).toFixed(3));
          }
        }
      }

      function tick() {
        current += (target - current) * ease;
        if (Math.abs(target - current) < 0.02) current = target;
        draw(current);
        frame = (current === target) ? null : window.requestAnimationFrame(tick);
      }

      function turn(degrees) {
        target += degrees;
        if (!touched && hint) { touched = true; hint.style.opacity = '0'; }
        if (still) { current = target; draw(current); return; }
        if (!frame) frame = window.requestAnimationFrame(tick);
      }

      // The page itself never scrolls, so every wheel gesture, up, down, left
      // or right, is spent turning the room instead.
      stage.addEventListener('wheel', function (e) {
        e.preventDefault();
        var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
        turn(-d * perPx);
      }, { passive: false });

      var lastX = null, lastY = null;
      stage.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) return;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      }, { passive: true });

      stage.addEventListener('touchmove', function (e) {
        if (lastX === null || e.touches.length !== 1) return;
        e.preventDefault();
        var x = e.touches[0].clientX, y = e.touches[0].clientY;
        var dx = x - lastX, dy = y - lastY;
        var d = Math.abs(dx) > Math.abs(dy) ? dx : -dy;
        turn(d * perPx * 1.6);
        lastX = x; lastY = y;
      }, { passive: false });

      stage.addEventListener('touchend', function () { lastX = null; lastY = null; }, { passive: true });

      // With the page locked there is nothing for the keyboard to scroll, so
      // the arrow keys and page keys drive the ring directly.
      window.addEventListener('keydown', function (e) {
        var k = e.key;
        if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown') { e.preventDefault(); turn(-step / 2); }
        else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); turn(step / 2); }
      });

      window.addEventListener('resize', function () { draw(current); });
      draw(current);
    })();
  </script>
